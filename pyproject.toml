[project]
name = "resume-mod"
version = "0.1.0"
description = "Auto Resume Modifier — tailor resumes to job descriptions using LLM + ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Environment
    "python-dotenv>=1.2.2",
    # LangChain core
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    # LangChain LLM integrations (Groq + Google only)
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.3.3",
    # LangChain vector store + embeddings
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    # Hugging Face / embeddings
    "sentence-transformers>=5.7.0",
    "huggingface-hub>=1.27.0",
    # Document processing
    "pymupdf>=1.28.2",
    "docx2txt>=0.9",
    # Vector database
    "chromadb>=1.5.9",
    # Web search / scraping
    "tavily-python>=0.7.27",
    "apify-client>=3.1.2",
    # PDF generation
    "reportlab>=5.0.0",
    # Memory queue (optional — only needed if Redis is running)
    "redis>=5.0.0",
    "groq>=0.37.1",
    "pypdf>=6.16.0",
    # Web interface dependencies
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
resume-mod = "resume_mod.runner:run_pipeline"
resume-web = "web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_mod", "web"]
